<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TermiChat</title>
</head>
<body>
  <h2>TermiChat</h2>
  
  <div id="chat" style="height: 300px; border: 1px solid #ccc; overflow-y: scroll; padding: 10px; margin-bottom: 10px;"></div>

  <form id="form">
    <input type="text" id="input" placeholder="Type a message..." style="width: 75%; padding: 8px;" required>
    <button type="submit" style="padding: 8px 16px;">Send</button>
  </form>

  <script>
    const chat = document.getElementById('chat');
    const form = document.getElementById('form');
    const input = document.getElementById('input');

    const ws = new WebSocket('ws://' + window.location.host + '/ws');

    ws.onopen = () => {
      addMessage('[Connected to server]');
    };

    ws.onmessage = (event) => {
      addMessage(event.data);
    };

    ws.onclose = () => {
      addMessage('[Disconnected from server]');
    };

    form.onsubmit = (e) => {
      e.preventDefault();
      const msg = input.value.trim();
      if (msg) {
        ws.send(msg);
        input.value = '';
      }
    };

    function addMessage(text) {
      const div = document.createElement('div');
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }
  </script>
</body>
</html>
