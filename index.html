<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TermiChat</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      max-width: 600px;
      margin: 0 auto;
      padding: 12px;
      background: #f9f9f9;
      color: #333;
    }
    header {
      text-align: center;
      margin-bottom: 8px;
    }
    h2 {
      font-size: 1.3rem;
    }
    .status-badge {
      display: inline-block;
      font-size: 0.78rem;
      color: #34c759;
      background: rgba(52, 199, 89, 0.12);
      padding: 3px 12px;
      border-radius: 12px;
      margin-top: 4px;
      font-weight: 500;
    }
    #chat {
      flex: 1;
      border: 1px solid #ccc;
      border-radius: 12px;
      background: #fff;
      overflow-y: auto;
      padding: 12px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg {
      background: #e9e9eb;
      padding: 10px 14px;
      border-radius: 16px;
      word-break: break-word;
      font-size: 0.95rem;
      max-width: 85%;
      align-self: flex-start;
    }
    .msg.sent {
      background: #007aff;
      color: #fff;
      align-self: flex-end;
    }
    .system-msg {
      align-self: center;
      background: none;
      color: #8e8e93;
      font-size: 0.8rem;
    }
    #form {
      display: flex;
      gap: 8px;
    }
    #input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #ccc;
      border-radius: 20px;
      font-size: 16px; /* Prevents iPhone Safari auto-zoom */
      outline: none;
    }
    #input:focus {
      border-color: #007aff;
    }
    .send-btn {
      padding: 12px 20px;
      background: #007aff;
      color: #fff;
      border: none;
      border-radius: 20px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .send-btn:active {
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <header>
    <h2>TermiChat</h2>
    <div id="status" class="status-badge">Live (5G Connected)</div>
  </header>
  
  <div id="chat"></div>

  <form id="form">
    <input type="text" id="input" placeholder="Type a message..." autocomplete="off" required>
    <button type="submit" class="send-btn">Send</button>
  </form>

  <script>
    const chat = document.getElementById('chat');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const statusDiv = document.getElementById('status');

    let ws = null;
    let knownMsgIds = new Set();

    // 1. Try local WebSocket first if running locally
    if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
      try {
        ws = new WebSocket('ws://' + window.location.host + '/ws');
        ws.onopen = () => {
          setStatus('Connected (Local Server)');
          addMessage('[Connected to local server]', true);
        };
        ws.onmessage = (e) => addMessage(e.data, false);
        ws.onclose = () => startCloudApiSync();
        ws.onerror = () => startCloudApiSync();
      } catch (e) {
        startCloudApiSync();
      }
    } else {
      startCloudApiSync();
    }

    // 2. Cloud 5G Instant Serverless Sync
    function startCloudApiSync() {
      setStatus('Live (5G Connected)');
      fetchMessages();
      setInterval(fetchMessages, 1000);
    }

    async function fetchMessages() {
      try {
        const res = await fetch('/api/messages');
        if (!res.ok) return;
        const data = await res.json();
        if (data && data.messages) {
          data.messages.forEach(m => {
            if (!knownMsgIds.has(m.id)) {
              knownMsgIds.add(m.id);
              addMessage(m.text, false);
            }
          });
        }
      } catch (e) {
        // Silent retry
      }
    }

    form.onsubmit = async (e) => {
      e.preventDefault();
      const msg = input.value.trim();
      if (!msg) return;

      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(msg);
        input.value = '';
      } else {
        const textToSend = msg;
        input.value = '';
        try {
          const res = await fetch('/api/messages', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: textToSend })
          });
          if (res.ok) {
            fetchMessages();
          }
        } catch (err) {
          addMessage('[Failed to send on 5G: ' + err.message + ']', true);
        }
      }
    };

    function setStatus(text) {
      statusDiv.textContent = text;
    }

    function addMessage(text, isSystem = false) {
      const div = document.createElement('div');
      if (isSystem) {
        div.className = 'system-msg';
      } else {
        div.className = 'msg';
      }
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }
  </script>
</body>
</html>
