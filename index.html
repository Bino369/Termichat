<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="TermiChat - Real-time cross-platform Web & CLI messaging application.">
  <meta name="theme-color" content="#007aff">
  <meta property="og:title" content="TermiChat - Real-Time Web & CLI Chat">
  <meta property="og:description" content="Fast, lightweight chat interface powered by WebSockets and Vercel Serverless endpoints.">
  <meta property="twitter:card" content="summary_large_image">
  <title>TermiChat</title>
  <style>
    :root {
      --primary-color: #007aff;
      --bg-color: #f9f9f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-color: #e5e5ea;
      --status-bg: rgba(52, 199, 89, 0.12);
      --status-color: #34c759;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      max-width: 600px;
      margin: 0 auto;
      padding: 12px;
      background: var(--bg-color);
      color: var(--text-color);
    }
    header {
      text-align: center;
      margin-bottom: 8px;
    }
    h2 {
      font-size: 1.3rem;
      margin-bottom: 4px;
    }
    .user-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      background: #fff;
      padding: 6px 12px;
      border-radius: 12px;
      border: 1px solid #e5e5ea;
    }
    .user-bar label {
      font-size: 0.85rem;
      font-weight: 500;
      color: #666;
    }
    .user-bar input {
      padding: 4px 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.85rem;
      width: 120px;
      outline: none;
    }
    .status-badge {
      display: inline-block;
      font-size: 0.78rem;
      color: #34c759;
      background: rgba(52, 199, 89, 0.12);
      padding: 3px 10px;
      border-radius: 12px;
      font-weight: 500;
    }
    #chat {
      flex: 1;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      background: var(--card-bg);
      overflow-y: auto;
      padding: 12px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    #chat::-webkit-scrollbar {
      width: 5px;
    }
    #chat::-webkit-scrollbar-track {
      background: transparent;
    }
    #chat::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.15);
      border-radius: 3px;
    }
    #chat::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 0, 0, 0.3);
    }
    .msg {
      background: #e9e9eb;
      padding: 8px 12px;
      border-radius: 16px;
      word-break: break-word;
      font-size: 0.95rem;
      max-width: 85%;
      align-self: flex-start;
      display: flex;
      flex-direction: column;
    }
    .msg.sent {
      background: #007aff;
      color: #fff;
      align-self: flex-end;
    }
    .sender-name {
      font-size: 0.72rem;
      font-weight: 600;
      margin-bottom: 2px;
      color: #555;
    }
    .msg.sent .sender-name {
      color: rgba(255, 255, 255, 0.85);
    }
    .system-msg {
      align-self: center;
      background: none;
      color: #8e8e93;
      font-size: 0.8rem;
    }
    #form {
      display: flex;
      gap: 8px;
    }
    #input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #ccc;
      border-radius: 20px;
      font-size: 16px; /* Prevents iPhone Safari auto-zoom */
      outline: none;
    }
    #input:focus {
      border-color: #007aff;
    }
    .send-btn {
      padding: 12px 20px;
      background: #007aff;
      color: #fff;
      border: none;
      border-radius: 20px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .send-btn:active {
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <header>
    <h2>TermiChat</h2>
    <div class="user-bar">
      <div id="status" class="status-badge">Live (Connected)</div>
      <div>
        <label for="username">Name: </label>
        <input type="text" id="username" placeholder="Your Name" maxlength="15">
      </div>
    </div>
  </header>
  
  <div id="chat"></div>

  <form id="form">
    <input type="text" id="input" placeholder="Type a message..." maxlength="500" autocomplete="off" required>
    <button type="submit" class="send-btn">Send</button>
  </form>

  <script>
    const chat = document.getElementById('chat');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const statusDiv = document.getElementById('status');
    const usernameInput = document.getElementById('username');

    // Record session start timestamp so refresh clears past history
    const sessionStartTime = Date.now();

    // Load or generate default username
    let currentUsername = localStorage.getItem('termichat_username') || ('User' + Math.floor(100 + Math.random() * 900));
    usernameInput.value = currentUsername;

    usernameInput.addEventListener('input', () => {
      currentUsername = usernameInput.value.trim() || 'Anonymous';
      localStorage.setItem('termichat_username', currentUsername);
    });

    let ws = null;
    let knownMsgIds = new Set();

    // 1. Try local WebSocket first if running locally
    if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
      try {
        ws = new WebSocket('ws://' + window.location.host + '/ws');
        ws.onopen = () => {
          setStatus('Connected (Local Server)');
          addMessage({ sender: 'System', text: 'Connected to local server' }, true);
        };
        ws.onmessage = (e) => addMessage({ sender: 'Them', text: e.data }, false);
        ws.onclose = () => startCloudApiSync();
        ws.onerror = () => startCloudApiSync();
      } catch (e) {
        startCloudApiSync();
      }
    } else {
      startCloudApiSync();
    }

    // 2. Cloud 5G Instant Serverless Sync
    function startCloudApiSync() {
      setStatus('Live (Connected)');
      fetchMessages();
      setInterval(fetchMessages, 1000);
    }

    async function fetchMessages() {
      try {
        const res = await fetch('/api/messages');
        if (!res.ok) return;
        const data = await res.json();
        if (data && data.messages) {
          data.messages.forEach(m => {
            // Only render messages sent AFTER this page session started
            if (m.timestamp >= sessionStartTime && !knownMsgIds.has(m.id)) {
              knownMsgIds.add(m.id);
              addMessage(m, false);
            }
          });
        }
      } catch (e) {
        // Silent retry
      }
    }

    form.onsubmit = async (e) => {
      e.preventDefault();
      const msg = input.value.trim();
      if (!msg) return;

      const user = usernameInput.value.trim() || 'Anonymous';

      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(user + ': ' + msg);
        input.value = '';
      } else {
        const textToSend = msg;
        input.value = '';
        try {
          const res = await fetch('/api/messages', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sender: user, text: textToSend })
          });
          if (res.ok) {
            fetchMessages();
          }
        } catch (err) {
          addMessage({ sender: 'System', text: 'Failed to send: ' + err.message }, true);
        }
      }
    };

    function setStatus(text) {
      statusDiv.textContent = text;
    }

    function addMessage(msgObj, isSystem = false) {
      const div = document.createElement('div');
      if (isSystem) {
        div.className = 'system-msg';
        div.textContent = msgObj.text || msgObj;
      } else {
        const sender = msgObj.sender || 'Anonymous';
        const isSent = (sender === currentUsername);
        div.className = isSent ? 'msg sent' : 'msg';

        const nameSpan = document.createElement('span');
        nameSpan.className = 'sender-name';
        nameSpan.textContent = sender;

        const textSpan = document.createElement('span');
        textSpan.textContent = msgObj.text || msgObj;

        div.appendChild(nameSpan);
        div.appendChild(textSpan);
      }

      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }
  </script>
</body>
</html>
