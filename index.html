<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TermiChat</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      max-width: 600px;
      margin: 0 auto;
      padding: 12px;
      background: #f9f9f9;
      color: #333;
    }
    h2 {
      text-align: center;
      margin-bottom: 8px;
      font-size: 1.3rem;
    }
    #chat {
      flex: 1;
      border: 1px solid #ccc;
      border-radius: 12px;
      background: #fff;
      overflow-y: auto;
      padding: 12px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg {
      background: #e9e9eb;
      padding: 10px 14px;
      border-radius: 16px;
      word-break: break-word;
      font-size: 0.95rem;
      max-width: 85%;
      align-self: flex-start;
    }
    .system-msg {
      align-self: center;
      background: none;
      color: #8e8e93;
      font-size: 0.8rem;
    }
    #form {
      display: flex;
      gap: 8px;
    }
    #input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #ccc;
      border-radius: 20px;
      font-size: 16px; /* Prevents iPhone Safari auto-zoom */
      outline: none;
    }
    #input:focus {
      border-color: #007aff;
    }
    button {
      padding: 12px 20px;
      background: #007aff;
      color: #fff;
      border: none;
      border-radius: 20px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    button:active {
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <h2>TermiChat</h2>
  
  <div id="chat"></div>

  <form id="form">
    <input type="text" id="input" placeholder="Type a message..." autocomplete="off" required>
    <button type="submit">Send</button>
  </form>

  <script>
    const chat = document.getElementById('chat');
    const form = document.getElementById('form');
    const input = document.getElementById('input');

    const ws = new WebSocket('ws://' + window.location.host + '/ws');

    ws.onopen = () => {
      addMessage('[Connected to server]', true);
    };

    ws.onmessage = (event) => {
      addMessage(event.data, false);
    };

    ws.onclose = () => {
      addMessage('[Disconnected from server]', true);
    };

    form.onsubmit = (e) => {
      e.preventDefault();
      const msg = input.value.trim();
      if (msg) {
        ws.send(msg);
        input.value = '';
      }
    };

    function addMessage(text, isSystem = false) {
      const div = document.createElement('div');
      div.className = isSystem ? 'system-msg' : 'msg';
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }
  </script>
</body>
</html>
