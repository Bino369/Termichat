<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TermiChat</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      max-width: 600px;
      margin: 0 auto;
      padding: 12px;
      background: #f9f9f9;
      color: #333;
    }
    header {
      text-align: center;
      margin-bottom: 8px;
    }
    h2 {
      font-size: 1.3rem;
    }
    .status-badge {
      display: inline-block;
      font-size: 0.78rem;
      color: #34c759;
      background: rgba(52, 199, 89, 0.12);
      padding: 3px 12px;
      border-radius: 12px;
      margin-top: 4px;
      font-weight: 500;
    }
    #chat {
      flex: 1;
      border: 1px solid #ccc;
      border-radius: 12px;
      background: #fff;
      overflow-y: auto;
      padding: 12px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg {
      background: #e9e9eb;
      padding: 10px 14px;
      border-radius: 16px;
      word-break: break-word;
      font-size: 0.95rem;
      max-width: 85%;
      align-self: flex-start;
    }
    .msg.sent {
      background: #007aff;
      color: #fff;
      align-self: flex-end;
    }
    .system-msg {
      align-self: center;
      background: none;
      color: #8e8e93;
      font-size: 0.8rem;
    }
    #form {
      display: flex;
      gap: 8px;
    }
    #input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #ccc;
      border-radius: 20px;
      font-size: 16px; /* Prevents iPhone Safari auto-zoom */
      outline: none;
    }
    #input:focus {
      border-color: #007aff;
    }
    .send-btn {
      padding: 12px 20px;
      background: #007aff;
      color: #fff;
      border: none;
      border-radius: 20px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .send-btn:active {
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <header>
    <h2>TermiChat</h2>
    <div id="status" class="status-badge">Connecting...</div>
  </header>
  
  <div id="chat"></div>

  <form id="form">
    <input type="text" id="input" placeholder="Type a message..." autocomplete="off" required>
    <button type="submit" class="send-btn">Send</button>
  </form>

  <script>
    const chat = document.getElementById('chat');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const statusDiv = document.getElementById('status');

    let ws = null;
    let peer = null;
    let connections = [];
    let isHub = false;
    let hubConn = null;

    const GLOBAL_HUB_ID = 'termichat-global-room-hub-v1';

    // 1. Try local server WebSocket first if running
    try {
      ws = new WebSocket('ws://' + window.location.host + '/ws');
      ws.onopen = () => {
        setStatus('Connected (Local Server)');
        addMessage('[Connected to local server]', true);
      };
      ws.onmessage = (e) => addMessage(e.data, false);
      ws.onclose = () => startAutoCloudChat();
      ws.onerror = () => startAutoCloudChat();
    } catch (e) {
      startAutoCloudChat();
    }

    // 2. Automatic zero-code live room auto-connect for Vercel
    function startAutoCloudChat() {
      if (peer) return;
      setStatus('Connecting to Live Room...');

      peer = new Peer(GLOBAL_HUB_ID);

      peer.on('open', () => {
        isHub = true;
        setStatus('Live Broadcast');
        addMessage('[Connected to Live Room! Open this link on any phone to chat instantly]', true);
      });

      peer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
          connectAsClient();
        } else {
          console.warn(err);
        }
      });

      peer.on('connection', (c) => {
        connections.push(c);
        c.on('data', (data) => {
          addMessage(data, false);
          // Relay to all other connected phones
          connections.forEach(other => {
            if (other !== c && other.open) {
              other.send(data);
            }
          });
        });
        c.on('close', () => {
          connections = connections.filter(conn => conn !== c);
        });
      });
    }

    function connectAsClient() {
      const myId = 'user-' + Math.floor(1000 + Math.random() * 9000);
      peer = new Peer(myId);

      peer.on('open', () => {
        hubConn = peer.connect(GLOBAL_HUB_ID);

        hubConn.on('open', () => {
          setStatus('Live Broadcast');
          addMessage('[Connected to Live Chat!]', true);
        });

        hubConn.on('data', (data) => {
          addMessage(data, false);
        });

        hubConn.on('close', () => {
          setStatus('Reconnecting...');
          setTimeout(() => location.reload(), 2000);
        });
      });
    }

    function setStatus(text) {
      statusDiv.textContent = text;
    }

    form.onsubmit = (e) => {
      e.preventDefault();
      const msg = input.value.trim();
      if (!msg) return;

      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(msg);
        input.value = '';
      } else if (isHub) {
        addMessage(msg, false, true);
        connections.forEach(c => {
          if (c.open) c.send(msg);
        });
        input.value = '';
      } else if (hubConn && hubConn.open) {
        hubConn.send(msg);
        addMessage(msg, false, true);
        input.value = '';
      } else {
        addMessage('[Connecting to live room... please wait]', true);
      }
    };

    function addMessage(text, isSystem = false, isSent = false) {
      const div = document.createElement('div');
      if (isSystem) {
        div.className = 'system-msg';
      } else if (isSent) {
        div.className = 'msg sent';
      } else {
        div.className = 'msg';
      }
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }
  </script>
</body>
</html>
